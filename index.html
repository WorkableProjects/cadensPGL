<!doctype html>
<html lang="en" data-text-size="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caden's Gift List</title>
  <meta name="description" content="Caden's gift wishlist: see what he wants, why he wants it, and where to buy it.">
  <script>
    (function () {
      var root = document.documentElement, skins = ['declaration', 'apple', 'anthropic'], entered = false;
      try {
        var s = localStorage.getItem('pgl.textSize');
        if (s === 'normal' || s === 'bigger' || s === 'biggest') root.setAttribute('data-text-size', s);
        var k = localStorage.getItem('pgl.skin');
        root.setAttribute('data-skin', skins.indexOf(k) >= 0 ? k : 'apple');
        entered = sessionStorage.getItem('pgl.entered') === '1';
      } catch (e) { root.setAttribute('data-skin', 'apple'); }
      if (!entered) root.classList.add('gate-open');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Pinyon+Script&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/themes.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/gate.css">
</head>
<body>
  <div id="gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <form id="gate-form" class="gate-panel">
      <div class="gate-head">
        <p class="gate-kicker">Welcome to</p>
        <h2 id="gate-title" class="gate-title">Caden's Gift List</h2>
        <p class="gate-sub">Pick how you'd like it to look. You can change both later.</p>
      </div>

      <fieldset class="gate-set">
        <legend><span class="gate-step" aria-hidden="true">1</span>Pick a look</legend>
        <div class="gate-options">
          <label class="opt look-declaration">
            <input type="radio" name="skin" value="declaration">
            <span class="opt-check" aria-hidden="true">✓</span>
            <span class="look-swatch" aria-hidden="true"><span class="sw-img"></span><span class="sw-lines"><span class="sw-title">Gift List</span><span class="sw-line"></span><span class="sw-line" style="width:70%"></span><span class="sw-btn"></span></span></span>
            <span class="opt-name">Declaration of Independence</span>
            <span class="opt-desc">Parchment, quill and wax seal</span>
          </label>
          <label class="opt look-apple">
            <input type="radio" name="skin" value="apple">
            <span class="opt-check" aria-hidden="true">✓</span>
            <span class="look-swatch" aria-hidden="true"><span class="sw-img"></span><span class="sw-lines"><span class="sw-title">Gift List</span><span class="sw-line"></span><span class="sw-line" style="width:70%"></span><span class="sw-btn"></span></span></span>
            <span class="opt-name">Apple</span>
            <span class="opt-desc">Clean, bright and minimal</span>
          </label>
          <label class="opt look-anthropic">
            <input type="radio" name="skin" value="anthropic">
            <span class="opt-check" aria-hidden="true">✓</span>
            <span class="look-swatch" aria-hidden="true"><span class="sw-img"></span><span class="sw-lines"><span class="sw-title">Gift List</span><span class="sw-line"></span><span class="sw-line" style="width:70%"></span><span class="sw-btn"></span></span></span>
            <span class="opt-name">Anthropic</span>
            <span class="opt-desc">Warm ivory, clay and serif type</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="gate-set">
        <legend><span class="gate-step" aria-hidden="true">2</span>Pick a text size</legend>
        <div class="gate-options gate-sizes">
          <label class="opt size-normal">
            <input type="radio" name="size" value="normal">
            <span class="opt-check" aria-hidden="true">✓</span>
            <span class="size-sample" aria-hidden="true">Aa</span>
            <span class="opt-name">Normal</span>
          </label>
          <label class="opt size-bigger">
            <input type="radio" name="size" value="bigger">
            <span class="opt-check" aria-hidden="true">✓</span>
            <span class="size-sample" aria-hidden="true">Aa</span>
            <span class="opt-name">Bigger</span>
          </label>
          <label class="opt size-biggest">
            <input type="radio" name="size" value="biggest">
            <span class="opt-check" aria-hidden="true">✓</span>
            <span class="size-sample" aria-hidden="true">Aa</span>
            <span class="opt-name">Biggest</span>
          </label>
        </div>
      </fieldset>

      <div class="gate-foot">
        <button type="submit" class="btn btn-primary gate-enter">Enter the gift list <span class="arrow" aria-hidden="true">→</span></button>
      </div>
    </form>
  </div>
  <div id="intro" class="intro" aria-hidden="true"></div>
  <a class="skip-link" href="#gifts">Skip to gifts</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <h1 id="page-title">Caden's Gift List</h1>
      <p id="welcome" class="welcome"></p>
      <p class="helper">Tap a gift to see why I want it and where to buy it.</p>
    </div>
  </header>

  <div class="toolbar" role="search" aria-label="Find and filter gifts">
    <div class="wrap toolbar-inner">
      <div class="field search-field">
        <label for="search">Search gifts</label>
        <input id="search" class="input" type="search" placeholder="Try a name, tag, or reason" autocomplete="off" enterkeyhint="search">
      </div>

      <div class="ctl-group">
        <span class="ctl-label" id="filter-label">Show</span>
        <div class="seg" id="filter-seg" role="group" aria-labelledby="filter-label">
          <button type="button" class="seg-btn" data-filter="all" aria-pressed="true">All (0)</button>
          <button type="button" class="seg-btn" data-filter="available" aria-pressed="false">Available (0)</button>
          <button type="button" class="seg-btn" data-filter="purchased" aria-pressed="false">Purchased (0)</button>
        </div>
      </div>

      <div class="ctl-group">
        <span class="ctl-label" id="skin-label">Look</span>
        <div class="seg" id="skin-seg" role="group" aria-labelledby="skin-label">
          <button type="button" class="seg-btn" data-skin="declaration" aria-pressed="false">Declaration</button>
          <button type="button" class="seg-btn" data-skin="apple" aria-pressed="true">Apple</button>
          <button type="button" class="seg-btn" data-skin="anthropic" aria-pressed="false">Anthropic</button>
        </div>
      </div>

      <div class="ctl-group">
        <span class="ctl-label" id="size-label">Text size</span>
        <div class="seg" id="size-seg" role="group" aria-labelledby="size-label">
          <button type="button" class="seg-btn" data-size="normal" aria-pressed="true">Normal</button>
          <button type="button" class="seg-btn" data-size="bigger" aria-pressed="false">Bigger</button>
          <button type="button" class="seg-btn" data-size="biggest" aria-pressed="false">Biggest</button>
        </div>
      </div>

      <div class="refresh-group">
        <button type="button" id="refresh" class="btn btn-secondary"><span class="spinner" aria-hidden="true"></span><span id="refresh-label">Refresh list</span></button>
        <p class="updated">Last updated <time id="updated" datetime="">…</time></p>
      </div>
    </div>
  </div>

  <div class="wrap">
    <p id="stats" class="stats" aria-live="polite"></p>
    <div id="banners" class="banners" role="status"></div>
  </div>

  <main id="gifts" class="wrap main" tabindex="-1">
    <ul id="grid" class="grid" aria-label="Gifts"></ul>
    <div id="state-area"></div>
    <noscript><p class="empty">This gift list needs JavaScript to load. Please turn it on and refresh the page.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="wrap"><a href="admin.html">List keeper tools</a></div>
  </footer>

  <p id="sr-status" class="visually-hidden" role="status" aria-live="polite"></p>
  <div id="toasts" class="toast-region body-toasts" role="status" aria-live="polite"></div>

  <script src="vendor/papaparse.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
